[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-ai-v01"
version = "0.1.0"
description = "Deterministic CAD AI V0.1 vertical slice"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

