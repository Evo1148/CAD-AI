[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-ai"
version = "0.2.0"
description = "Local-first AI system for validated parametric CAD generation and controlled repair"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
